[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BayesForge"
version = "0.0.60"
authors = [
    {name = "Sebastian Sosa", email = "BF@s-sosa.com"}
]
description = "A Python package for BayesForge modeling and diagnostics."
readme = "README.md"
# arviz >= 1.2 requires Python >= 3.12; jax >= 0.10 / numpyro >= 0.21 also
# dropped 3.10/3.11. Python 3.12+ is required.
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"} # Using the standard identifier is slightly cleaner
keywords = ["python", "Bayesian inferences"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

# Core dependencies: 'jax'/'jaxlib' are declared in the [cpu]/[gpu] extras.
# numpyro >= 0.21.0 is required: 0.19.x imports `xla_pmap_p` from
# jax.interpreters.pxla, which was removed in jax 0.10.x, so it fails to
# import against the jax >= 0.10.0 pinned below.
# funsor >= 0.4.8 is required: <= 0.4.5 calls np.clip(..., a_min=..., a_max=...)
# in funsor.jax.ops._safe_logaddexp_number_tensor, and jax >= 0.10.0 dropped
# those legacy aliases from jax.numpy.clip, so infer_discrete=True crashes with
# "TypeError: clip() got an unexpected keyword argument 'a_max'" under 0.4.5.

dependencies = [
    "numpyro >= 0.21.0",
    "cloudpickle",
    "numpy >= 2.2.0",
    "matplotlib >= 3.10.0",
    "pandas",
    "seaborn >= 0.13.0",
    "tfp-nightly",
    "arviz >= 1.2.0",
    "funsor >= 0.4.8",
    "plotly >= 6.0.0",
    "IPython >= 7.34.0",
    "scipy",
]



[project.optional-dependencies]
cpu = [
    "jax >= 0.10.0",
    "jaxlib >= 0.10.0",
]
gpu = [
    "jax[cuda12_pip]",
]

[project.urls]
"Homepage" = "https://github.com/BGN-for-ASNA/BF"
"Bug Tracker" = "https://github.com/BGN-for-ASNA/BF/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"BayesForge.Network" = ["assets/netexplorer/*"]
"BayesForge.Resources" = ["*.csv", "*.rda", "*.json"]

[tool.pytest.ini_options]
markers = [
    "slow: statistical checks that take minutes (run in CI; skip locally with -m 'not slow')",
    "pages: execute every model page of the documentation (weekly CI workflow)",
    "lang: cross-language model cases, Python vs R vs Julia (Test/**/cases/*.md)",
]
