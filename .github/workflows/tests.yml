name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install BayesForge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu]" pytest

      # Tests of the core functions (Test/0.Core), the three-language check of
      # the "Get started" pages and their Python examples
      # (Test/3.Documentation/Python). Test/0.Core/conftest.py prints a table of
      # the statistical checks, adds it to the job summary and writes
      # Test/0.Core/_report/ (table + plots).
      - name: Run tests
        run: python -m pytest Test/0.Core Test/3.Documentation/test_language_coverage.py Test/3.Documentation/Python -q -m "not pages"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-py${{ matrix.python-version }}
          path: Test/0.Core/_report/
          if-no-files-found: ignore

  # R examples of the "Get started" pages (Test/3.Documentation/R), run with the
  # dev branch of the R package against this checkout of BayesForge.
  docs-r:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install BayesForge (Python)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu]" pytest scikit-learn
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install BayesForge (R, dev branch)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            github::BGN-for-ASNA/BFR@dev
            any::posterior
            any::bayesplot
            any::tidyverse
      - name: Run the R examples
        run: python -m pytest Test/3.Documentation/R -q -rA

  # Julia examples of the "Get started" pages (Test/3.Documentation/Julia), run
  # with the dev branch of PyBayesForge.jl against this checkout of
  # BayesForge (PythonCall uses this Python; CondaPkg is switched off).
  docs-julia:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      JULIA_CONDAPKG_BACKEND: "Null"
      BF_JULIA_PROJECT: ${{ github.workspace }}/.julia-docs
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install BayesForge (Python)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu]" pytest scikit-learn
          echo "JULIA_PYTHONCALL_EXE=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install PyBayesForge.jl (dev branch)
        run: |
          julia --project="$BF_JULIA_PROJECT" -e 'using Pkg
            Pkg.add(url = "https://github.com/BGN-for-ASNA/PyBayesForge.jl", rev = "dev")
            Pkg.add(["PythonCall", "DataFrames", "CSV", "MCMCChains", "Distributions"])'
      - name: Run the Julia examples
        run: python -m pytest Test/3.Documentation/Julia -q -rA

  # One compatibility matrix (compat.toml) for the Python, R and Julia packages:
  # this repository's pyproject.toml and the dev branches of BFR and
  # PyBayesForge.jl must agree with it.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the compatibility matrix
        shell: bash          # with pipefail, so that | tee keeps the exit status
        run: python tools/check_compat.py | tee -a "$GITHUB_STEP_SUMMARY"
