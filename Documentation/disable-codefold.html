<script>
  // Synchronize body theme class to html/document element for root scrollbar styling
  function syncThemeClass() {
    const isDark = document.body.classList.contains('quarto-dark');
    document.documentElement.classList.toggle('quarto-dark', isDark);
    document.documentElement.classList.toggle('quarto-light', !isDark);
  }
  
  if (document.body) {
    syncThemeClass();
  }
  document.addEventListener("DOMContentLoaded", syncThemeClass);
  
  const themeObserver = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
      if (mutation.attributeName === 'class') {
        syncThemeClass();
      }
    });
  });
  
  if (document.body) {
    themeObserver.observe(document.body, { attributes: true });
  } else {
    document.addEventListener("DOMContentLoaded", function() {
      themeObserver.observe(document.body, { attributes: true });
    });
  }

  document.addEventListener("DOMContentLoaded", function() {
    // Set the global if Quarto respects it
    window.quartoDisableCodeFolding = true;
    
    // Manually hide any fold buttons that might have been rendered
    const style = document.createElement('style');
    style.innerHTML = `
      .quarto-code-tools-menu, 
      .quarto-code-collapse-toggle { 
        display: none !important; 
      }
    `;
    document.head.appendChild(style);
  });

  // Dynamic sidebar folding: fold everything except the current and NEXT section with smooth transitions
  (function() {
    function adjustSidebarFolding(useTransition) {
      const sidebar = document.querySelector('#quarto-sidebar');
      if (!sidebar) return;

      const sections = Array.from(sidebar.querySelectorAll('li.sidebar-item-section'));
      if (sections.length === 0) return;

      // Find the active link
      const activeLink = sidebar.querySelector('a.active');
      let currentSectionLi = null;
      if (activeLink) {
        currentSectionLi = activeLink.closest('li.sidebar-item-section');
      }

      // Determine the index of the current section
      const currentIndex = currentSectionLi ? sections.indexOf(currentSectionLi) : -1;

      sections.forEach((sectionLi, index) => {
        const shouldOpen = (currentIndex !== -1 && (index === currentIndex || index === currentIndex + 1));
        
        const ul = sectionLi.querySelector('ul.sidebar-section');
        if (ul) {
          if (useTransition && window.bootstrap && window.bootstrap.Collapse) {
            try {
              const bsCollapse = bootstrap.Collapse.getOrCreateInstance(ul, { toggle: false });
              if (shouldOpen) {
                bsCollapse.show();
              } else {
                bsCollapse.hide();
              }
            } catch (e) {
              toggleDOMDirectly(ul, shouldOpen);
              toggleTogglesDirectly(sectionLi, shouldOpen);
            }
          } else {
            toggleDOMDirectly(ul, shouldOpen);
            toggleTogglesDirectly(sectionLi, shouldOpen);
          }
        }
      });
    }

    function toggleDOMDirectly(ul, shouldOpen) {
      if (shouldOpen) {
        ul.classList.add('show');
      } else {
        ul.classList.remove('show');
      }
    }

    function toggleTogglesDirectly(sectionLi, shouldOpen) {
      const toggles = sectionLi.querySelectorAll('[data-bs-toggle="collapse"]');
      toggles.forEach(toggle => {
        toggle.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
        if (!shouldOpen) {
          toggle.classList.add('collapsed');
        } else {
          toggle.classList.remove('collapsed');
        }
      });
    }

    // Save the current active section index before leaving the page
    window.addEventListener('beforeunload', function() {
      const activeLink = document.querySelector('#quarto-sidebar a.active');
      if (activeLink) {
        const currentSectionLi = activeLink.closest('li.sidebar-item-section');
        const sections = Array.from(document.querySelectorAll('#quarto-sidebar li.sidebar-item-section'));
        const currentIndex = sections.indexOf(currentSectionLi);
        if (currentIndex !== -1) {
          sessionStorage.setItem('prevActiveSectionIndex', currentIndex);
        }
      }
    });

    // Helper to restore previous page's sidebar state instantly before DOMContentLoaded/paint
    function restorePreviousSidebarState() {
      const prevActiveIndexStr = sessionStorage.getItem('prevActiveSectionIndex');
      if (prevActiveIndexStr !== null) {
        const prevActiveIndex = parseInt(prevActiveIndexStr, 10);
        const sidebar = document.querySelector('#quarto-sidebar');
        if (!sidebar) return;
        
        const sections = Array.from(sidebar.querySelectorAll('li.sidebar-item-section'));
        sections.forEach((sectionLi, index) => {
          const shouldStartOpen = (index === prevActiveIndex || index === prevActiveIndex + 1);
          const ul = sectionLi.querySelector('ul.sidebar-section');
          if (ul) {
            toggleDOMDirectly(ul, shouldStartOpen);
          }
          toggleTogglesDirectly(sectionLi, shouldStartOpen);
        });
      }
    }

    // Try restoring immediately if the DOM elements are already available
    restorePreviousSidebarState();

    // Trigger smooth sliding folding animation shortly after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      // Restore again here just in case the elements weren't loaded when the script parsed
      restorePreviousSidebarState();
      
      setTimeout(function() {
        adjustSidebarFolding(true);
      }, 50);
    });
  })();

  // Robust Standalone ScrollSpy (works under file://, UNC paths, and HTTP)
  (function() {
    function initScrollspy() {
      const toc = document.querySelector('nav#TOC');
      if (!toc) return;

      const tocLinks = Array.from(toc.querySelectorAll('a[data-scroll-target]'));
      if (tocLinks.length === 0) return;

      function getTargetElement(link) {
        const targetAttr = link.getAttribute('data-scroll-target');
        if (!targetAttr) return null;
        const id = targetAttr.startsWith('#') ? decodeURIComponent(targetAttr.slice(1)) : decodeURIComponent(targetAttr);
        let el = document.getElementById(id);
        if (el) return el;
        try {
          if (window.CSS && CSS.escape) {
            el = document.querySelector('#' + CSS.escape(id));
            if (el) return el;
          }
        } catch(e) {}
        return document.querySelector(`[id="${id.replace(/"/g, '\\"')}"]`);
      }

      const targets = tocLinks.map(link => getTargetElement(link));

      function onScroll() {
        const scrollPos = window.pageYOffset || document.documentElement.scrollTop;
        const offsetMargin = 150;
        let activeIdx = -1;

        if (window.innerHeight + scrollPos >= (document.documentElement.scrollHeight || document.body.offsetHeight) - 30) {
          activeIdx = targets.length - 1;
        } else {
          for (let i = targets.length - 1; i >= 0; i--) {
            const el = targets[i];
            if (el) {
              const top = el.getBoundingClientRect().top + scrollPos;
              if (top <= scrollPos + offsetMargin) {
                activeIdx = i;
                break;
              }
            }
          }
        }

        if (activeIdx === -1 && targets.length > 0) {
          activeIdx = 0;
        }

        tocLinks.forEach((link, idx) => {
          if (idx === activeIdx) {
            link.classList.add('active');
            let parent = link.closest('ul.collapse');
            while (parent && toc.contains(parent)) {
              parent.classList.remove('collapse');
              parent = parent.parentElement.closest('ul.collapse');
            }
          } else {
            link.classList.remove('active');
          }
        });
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      setTimeout(onScroll, 100);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initScrollspy);
    } else {
      initScrollspy();
    }
  })();
</script>
