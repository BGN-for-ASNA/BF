<!-- header-scripts.html -->
<script>
  // MathJax (loaded synchronously by Plotly figure outputs, and by
  // tooltip-scripts.html) auto-typesets the whole page at startup, which
  // replaces the raw TeX text node inside Quarto's <span class="math">
  // elements with its own output; Quarto's KaTeX handler (DOMContentLoaded)
  // then renders the leftover whitespace, leaving an empty equation.
  // Disabling MathJax's initial typeset leaves those spans to KaTeX.
  // Plotly still typesets its own labels on demand (Hub.Queue), and the
  // tooltips are dynamic content MathJax never scanned anyway.
  window.MathJax = window.MathJax || {};
  window.MathJax.startup = Object.assign(window.MathJax.startup || {}, {
    typeset: false
  });
</script>
<script>
  (function() {
    const isFileUrl = () => window.location.protocol === 'file:';
    const getColorSchemeSentinel = () => {
      if (!isFileUrl()) {
        const storageValue = window.localStorage.getItem("quarto-color-scheme");
        return storageValue != null ? storageValue : "alternate"; // Default to dark/alternate
      } else {
        return "alternate";
      }
    };
    
    const alternate = (getColorSchemeSentinel() === "alternate");
    
    if (alternate) {
      // Instantly add dark classes to prevent FOUC (flash of unstyled content)
      document.documentElement.classList.add("quarto-dark");
      document.documentElement.classList.remove("quarto-light");
      
      // Function to instantly swap a stylesheet node to dark
      const makeNodeDark = (node) => {
        if (node.tagName === 'LINK' && node.classList.contains('quarto-color-alternate')) {
          // Dark is layered on light in Quarto: never disable the light sheet
          // (a `disabled` attribute survives Quarto's rel-based toggle and
          // leaves the page unstyled once the user switches to light).
          node.removeAttribute('disabled');
        }
      };

      // Check already parsed nodes in head
      if (document.head) {
        document.head.querySelectorAll('link.quarto-color-alternate').forEach(makeNodeDark);
      }

      // Set up MutationObserver to catch nodes appended later in head
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(makeNodeDark);
        });
      });
      
      // Wait for head to exist or observe documentElement if head is loading
      const target = document.head || document.documentElement;
      observer.observe(target, { childList: true, subtree: true });
      
      // Clean up observer and run final safety check on DOMContentLoaded
      document.addEventListener("DOMContentLoaded", function() {
        observer.disconnect();
        document.querySelectorAll('link.quarto-color-alternate').forEach(makeNodeDark);
      });
    } else {
      document.documentElement.classList.add("quarto-light");
      document.documentElement.classList.remove("quarto-dark");
    }
  })();
</script>
